[workspace]
members = ["apps/desktop", "crates/domain", "crates/engine", "crates/application"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"

[workspace.dependencies]
slint = "=1.16.0"
slint-build = "=1.16.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
