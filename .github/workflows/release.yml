name: Release installers
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
env:
  CARGO_BUILD_JOBS: '2'
  BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
  GH_REPO: ${{ github.repository }}
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python scripts/github-release.py prepare
        env:
          GH_TOKEN: ${{ github.token }}
  package:
    needs: prepare
    timeout-minutes: 180
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: macos
          - os: ubuntu-24.04
            platform: linux
          - os: windows-2025
            platform: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable action; toolchain pinned below
        with:
          toolchain: 1.96.1
          components: rustfmt, clippy
      - run: python scripts/github-release.py validate
      - name: macOS build tools
        if: runner.os == 'macOS'
        run: brew install meson ninja pkg-config xz
      - name: Linux build tools and desktop libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential meson ninja-build pkg-config nasm xz-utils dpkg-dev libfontconfig1-dev libxkbcommon-dev libwayland-dev libx11-dev libxcb-shape0-dev libxcb-xfixes0-dev libegl1-mesa-dev
      - name: Windows helper toolchain
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: UCRT64
          path-type: inherit
          update: true
          install: >-
            git make diffutils tar xz
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-nasm
      - name: Build and audit Unix helpers
        if: runner.os != 'Windows'
        run: bash packaging/release/build-helpers.sh
      - name: Build and audit Windows helpers
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: bash packaging/release/build-helpers.sh
      - name: Release helper build scratch space
        shell: bash
        run: |
          # The audited vendor directory now contains the required sources and records.
          rm -rf work/release
      - name: Windows application toolchain
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64
      - name: Locate Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $compiler = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $compiler)) { throw 'Inno Setup 6 is missing from this runner.' }
          Split-Path $compiler | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --lib --bins -- -D warnings
      - name: Package macOS
        if: runner.os == 'macOS'
        run: bash packaging/release/macos.sh unsigned
      - name: Package Linux
        if: runner.os == 'Linux'
        env:
          UFFMPEG_MAINTAINER: ${{ vars.UFFMPEG_MAINTAINER || format('{0} <{0}@users.noreply.github.com>', github.repository_owner) }}
        run: bash packaging/release/linux-deb.sh
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/release/windows.ps1
      - name: Attach installer, sources and checksums to draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PLATFORM: ${{ matrix.platform }}
        shell: bash
        run: python scripts/github-release.py upload "$RELEASE_PLATFORM"
  complete:
    needs: [prepare, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python scripts/github-release.py finish
        env:
          GH_TOKEN: ${{ github.token }}
