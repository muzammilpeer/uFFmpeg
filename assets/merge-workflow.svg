<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650"><rect width="1100" height="650" fill="#111827"/><g font-family="sans-serif" fill="#e2e8f0"><text x="45" y="55" font-size="30">uFFmpeg · Merge workflow</text><g fill="#1e293b" stroke="#38bdf8"><rect x="45" y="90" width="1010" height="80" rx="12"/><rect x="45" y="225" width="480" height="140" rx="12"/><rect x="575" y="225" width="480" height="140" rx="12"/><rect x="45" y="420" width="1010" height="80" rx="12"/><rect x="45" y="550" width="1010" height="60" rx="12"/></g><g font-size="21"><text x="70" y="122">Library order → re-probe whole clips → compatibility report</text><text x="70" y="151" font-size="16">Codecs · configuration hashes · timebases · video format · audio layout</text><text x="70" y="261">Fast copy · explicit compatibility gate</text><text x="70" y="295" font-size="16">Local-file concat manifest → unchanged codecs → MKV</text><text x="70" y="327" font-size="16">Codec delay may cause small join gaps or overlaps</text><text x="600" y="261">Normalize · explicit user choice</text><text x="600" y="295" font-size="16">First canvas · 30 fps · 48 kHz stereo · silence fill</text><text x="600" y="327" font-size="16">Lossless intermediates → MPEG-4 / AAC → MP4</text><text x="70" y="454">Stage in destination → check streams and duration</text><text x="70" y="484" font-size="16">Ordinary failure removes temporary files; existing outputs are protected</text><text x="70" y="589">Publish without overwrite → report the saved output path</text></g><path d="M285 170v55 M815 170v55 M285 365v55 M815 365v55 M550 500v50" fill="none" stroke="#38bdf8" stroke-width="3"/></g></svg>