<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650"><rect width="1100" height="650" fill="#111827"/><g font-family="sans-serif" fill="#e2e8f0"><text x="45" y="55" font-size="30">uFFmpeg · Audio extraction and stream selection</text><g fill="#1e293b" stroke="#38bdf8"><rect x="45" y="90" width="1010" height="85" rx="12"/><rect x="45" y="225" width="310" height="120" rx="12"/><rect x="395" y="225" width="310" height="120" rx="12"/><rect x="745" y="225" width="310" height="120" rx="12"/><rect x="45" y="400" width="1010" height="90" rx="12"/><rect x="45" y="545" width="1010" height="65" rx="12"/></g><g font-size="21"><text x="70" y="125">Choose source audio stream IDs → full source or saved ranges</text><text x="70" y="155" font-size="16">Selections are stored per source; split exports also use the chosen video and checked audio</text><text x="65" y="263">Copy · MKA</text><text x="65" y="296" font-size="16">Approved source codecs</text><text x="65" y="323" font-size="16">Packet-limited range cuts</text><text x="415" y="263">Convert · AAC M4A</text><text x="415" y="296" font-size="16">Native AAC · 192 kb/s</text><text x="415" y="323" font-size="16">Explicit lossy conversion</text><text x="765" y="263">Convert · WAV</text><text x="765" y="296" font-size="16">Signed 16-bit PCM</text><text x="765" y="323" font-size="16">Source sample rate / channels</text><text x="70" y="435">Validate streams and all filenames → one staged file per track / range</text><text x="70" y="468" font-size="16">Check audio-only output, codec, duration and layout; ordinary failures clean temporary files</text><text x="70" y="585">Publish without overwrite → report saved paths and any failure</text></g><path d="M200 175v50 M550 175v50 M900 175v50 M200 345v55 M550 345v55 M900 345v55 M550 490v55" fill="none" stroke="#38bdf8" stroke-width="3"/></g></svg>